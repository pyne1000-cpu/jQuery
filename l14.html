<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"> -->
    <link rel="stylesheet" href="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.css" type="text/css">
    <title></title>
    <style>
        body{
            box-sizing: border-box;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            min-width: 250px;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .form-group{
            margin-bottom: 10px;
        }
        .form-label{
            display: block;
        }
        .form-control{
            width: 100%;
            padding: 5px;
        }
        .form-control:focus{
            outline: none;
        }
        textarea{
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
       <form action="" method="">
        <div class="form-group">
            <label for="phno" class="form-label">Ph no.</label>
            <input type="text" name="phno" id="phno" class="form-control">
        </div>
        <div class="form-group">
            <label for="message" class="form-label">Message</label>
            <textarea type="text" name="message" id="message" class="form-control" maxlength="100" disabled></textarea>
            <span>0/100 characters are remaining.(0/5 SMS)</span>
        </div>
        <div class="btn">
            <button>send</button>
        </div>
    </form>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.js"></script>
    <script>
       $(document).ready(function(){
            const maxlength = $('#message').attr('maxlength');
            console.log(maxlength);

            $('#phno').keyup(function(){
                // console.log($(this).val());
                if($(this).val().trim().length >= 9 ){
                    $('#message').removeAttr("disabled",true);
                }else{
                    $('#message').attr("disabled",true);
                }
    
                $('#message').keyup(function(){
                    let getlength = $(this).val().length ;
                    let leftchar = maxlength - getlength;
                    let smscount = 0;

                    if(getlength === 0){
                        smscount = 0;
                    }else if(getlength <= 20){
                        smscount = 1;
                    }else if(getlength <= 40){
                        smscount = 2;
                    }else if(getlength <= 60){
                        smscount = 3;
                    }else if(getlength <= 80){
                        smscount = 4;
                    }else{
                        smscount = 5;
                    }
                    
                    $('.form-group > span').text(`${leftchar} are remaining.${smscount}/5 SMS`)
                    
                })

                $('form').submit(function(e){
                    e.preventDefault();
                    const getdata = {
                        phno:$('#phno').val(),
                        message:$('#message').val()
                    }
                    console.log(getdata.phno,getdata.message);
                })

            })
       })
    </script>
</body>
</html>
