<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Until</title>
    <style>
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            background-color: #f4f4f4;
        }
        .box{
            border: 1px solid #000;
            padding: 20px 40px;
        }
        ul{
            border: 3px dashed rgb(0, 255, 115);
            padding: 20px;
        }
        ul li{
            border: 3px dashed rgb(247, 0, 251);
        }
        button{
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box div1">I'm Div 1
            <div class="box div2">I'm Div 2
                <div class="box div3">I'm Div 3
                    <div class="box div4">I'm Div 4
                        <ul>
                            <li>
                                <h2>Hello World</h2>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <button id="cls-btn">Closest</button>
        <button id="par-unt">Parents Until</button>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#cls-btn').click(function(){
                console.log('clsbtn');
                $('h2').closest('div').css({
                    color:"blue",
                    fontSize:"30px",
                    border:"5px dashed orange"
                })
            })
            $('#par-unt').click(function(){
                $('h2').parentsUntil('.container').css({
                    color:"blue",
                    fontSize:"20px",
                    border:"5px dashed red"
                })
            })
        })
    </script>
</body>
</html>
