<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Select</title>

    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            background-color: #f4f4f4;
            padding: 20px;
        }
        .form-group{
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="" method="">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" class="form-control">
            </div>
            <div class="form-group">
                <label for="country">Country</label>
                <select name="country" id="country" class="form-selet">
                    <option selected disabled>Choose Country</option>
                    <option value="myanmar">Myanmar</option>
                    <option value="thailand">Thailand</option>
                    <option value="philipines">Philipines</option>
                    <option value="indonesia">Indonesia</option>
                    <option value="malaysia">Malaysia</option>
                    <option value="singapore">Singapore</option>
                </select>
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" class="form-control">
            </div><div class="form-group">
                <label for="phno">Phone Number</label>
                <input type="number" id="phno" class="form-control">
            </div><div class="form-group">
                <label for="nrc">NRC</label>
                <input type="number" id="nrc" class="form-control">
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(document).ready(function(){
            $('form').submit(function(e){
                e.preventDefault();
                console.log('form submitted');
            });
            $('#name').blur(function(){
                console.log('blur');
            });
            $('#age').change(function(){
                console.log('change');
            });
            $('#country').change(function(){
                console.log('change');
            })
            $('#phno').focusin(function(){
                console.log('focusin');
            })
            $('#nrc').focusout(function(){
                console.log('focusout');
            })
        })
    </script>
</body>
</html>
