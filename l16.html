<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"> -->
    <link rel="stylesheet" href="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.css" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Multiple Boxes</title>
    <style>
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <h2>Multiple Boxes</h2>
            </div>
            <div class="col-3"></div>
            <div class="col-6">
                <form action="" method="">
                    <div class="mb-5 exboxes d-flex form-group">
                        <input type="text" name="task[]" class="form-control">
                        <!-- <button class="btn bg-danger btn-sm ">Remove</button> -->
                    </div>
                </form>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn bg-success btn-sm rounded-0" id="addbtn">Add More</button>
                </div>
            </div>
            <div class="col-3"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script>
       $(document).ready(function(){

        let getnewid = 0;

        $('#addbtn').click(function(){
                getnewid++;
                // console.log($('.exboxes').val());
               const getbox = $('.exboxes').wrap("<div></div>").parent().html();
               console.log(getbox);
                $('.exboxes').unwrap();
                $(getbox).insertAfter($('.exboxes').last());
                $('.exboxes').last().attr('id','exbox'+getnewid);
                $('.form-group').last().append('<button type="button" class="btn bg-danger btn-sm rmbtn">Remove</button>')

                
            })
            $(document).on('click','.rmbtn',function(){
                    $(this).parent().remove();
                    console.log('remove');
                })
       })
    </script>
</body>
</html>
