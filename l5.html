<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChildParentSiblings</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            background-color: #f4f4f4;
            display: flex;
            justify-content: space-evenly;
            padding: 20px 10px;
        }
        .box{
            width: 150px;
            height: 300px;
            margin: 0 10px;
        }
        .box:hover{
            cursor: pointer;
        }
        .box:nth-of-type(1){
            background-color: red;
        }
        .box:nth-of-type(2){
            background-color: blue;
        }
        .box:nth-of-type(3){
            background-color: green;
        }
        .box:nth-of-type(4){
            background-color: yellow;
        }
        .box:nth-of-type(5){
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('.box').click(function(){
                $(this).parent().css({
                    background:'black',
                })
            })
            // $('.container').click(function(){
            //     $(this).children('.box:nth-of-type(odd)').css({
            //         background:'orange'
            //     })
            // })
            $('.box:nth-of-type(1)').click(function(){
                $(this).siblings().css('background','purple');
            })
        })
    </script>
</body>
</html>
