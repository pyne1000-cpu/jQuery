<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before After</title>
</head>
<body>
    <h1>Login</h1>
    <h2>Sing Up</h2>

    <button type="button" id="btn1">Insert Before</button>
    <button type="button" id="btn2">Insert After</button>
    <button type="button" id="btn3">Prepend</button>
    <button type="button" id="btn4">Append</button>
    <button type="button" id="btn5">AppendTo</button>
    <button type="button" id="btn6">Clone</button>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(document).ready(function(){
            $("#btn1").click(function(){
                $('h1').before('<p><b>Before</b></p>');
            })
            $("#btn2").click(function(){
                $('h2').after('<p><b>After</b><p>');
            })
            $("#btn3").click(function(){
                $('h1').prepend('<p>Prepend</p>');
            })
            $("#btn4").click(function(){
                $('h2').append("append");
            })
            $('#btn5').click(function(){
                $('<span>AppendTo</span>').appendTo('h2');
            })
            $("#btn6").click(function(){
                $('h1').clone().appendTo('h2');
            })
        })
    </script>
</body>
</html>
