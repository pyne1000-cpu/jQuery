<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"> -->
    <link rel="stylesheet" href="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.css" type="text/css">
    <title></title>
    <style>
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            background: #f4f4f4;
            padding: 10px;
        }
        .form-control{
            display: block;
            margin: 10px 0;
        }
        .gallery{
            border: 1px solid black;
            min-height: 100px;
            /* width: 100%; */
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }
        .gallery span{
            text-align: center;
        }
        .gallery .removetext{
            display: none;
        }
        .gallery img{
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
       <form action="" method="" enctype="multipart/form-data">
            <label for="coverphotos">Cover Photo</label>
            <input type="file" name="coverphotos[]" id="coverphotos" class="form-control" accept="image/*" multiple>
       </form>
       <div class="gallery">
            <span>Choose Images</span> 
       </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.js"></script>
    <script>
       $(document).ready(function(){
            $('#coverphotos').on('change',function(){
                const files = this.files;
                // $('.gallery').empty();
                if(files.length>0){
                    $('.gallery span').addClass('removetext');
                }else{
                    $('.gallery span').removeClass('removetext');
                }
                $.each(files,function(index,file){
                    if(!file.type.startsWith('image/')){
                        return;
                    }
                    const reader = new FileReader;
                    reader.onload = function(e){
                        const img = $('<img>');
                        img.attr('src',e.target.result);
                        $('.gallery').append(img);
                    }
                    reader.readAsDataURL(file);
                })
            })
       })
    </script>
</body>
</html>
