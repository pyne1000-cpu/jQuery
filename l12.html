<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.css" type="text/css">
    <title>Show Password</title>
    <style>
        #eye{
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="" method="">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control">
            </div>
            <div class="form-group">
                <label for="psw" class="form-label">Password</label>
                <input type="password" name="psw" id="psw" class="form-control">
                <span id="eye"><i id="eye" class="fa-solid fa-eye"></i>Show Password</span>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="./lib/jquery-ui-1.14.2.custom/jquery-ui.min.js"></script>
    <script>
        $(document).ready(function(){

            let gettype = $('#psw').attr('type');

            $('#eye').click(function(){

                if(gettype === 'password'){
                    gettype = 'text';
                    $('#eye').html('<i class="fa-solid fa-eye-slash"></i> Hide Password');
                }else{
                    gettype = 'password';
                    $('#eye').html('<i class="fa-solid fa-eye"></i> Show Password');
                }
                $('#psw').attr('type',gettype);
            })


        })
    </script>
</body>
</html>
